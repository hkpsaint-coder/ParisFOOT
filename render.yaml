databases:
  - name: parisfoot-db
    databaseName: parisfoot
    user: parisfoot
    plan: free

services:
  - type: web
    name: parisfoot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: fr
      - key: APP_KEY
        sync: false
      - key: ADMIN_NAME
        value: Administrateur
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: parisfoot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: parisfoot-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: parisfoot-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: parisfoot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: parisfoot-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
